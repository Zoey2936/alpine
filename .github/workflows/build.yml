name: build
on:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: package
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
          PACKAGER_PRIVKEY: /root/zoey2936.rsa
          REPODEST: /root/packages
        run: |
          docker run --rm -e ABUILD_PRIVKEY -e PACKAGER_PRIVKEY -e REPODEST -v "$PWD:/custom" -w /custom alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a sh -ec '
            apk add -U alpine-sdk
            printenv ABUILD_PRIVKEY > "$PACKAGER_PRIVKEY"
            openssl rsa -in "$PACKAGER_PRIVKEY" -pubout -out "$PACKAGER_PRIVKEY.pub"
            cp "$PACKAGER_PRIVKEY.pub" /etc/apk/keys/
            for dir in */; do abuild -F -r -C "$dir"; done
            mv "$REPODEST/${PWD##*/}" repo
            cp "$PACKAGER_PRIVKEY.pub" repo/
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64
          path: repo

  build-aarch64:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: package
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
          PACKAGER_PRIVKEY: /root/zoey2936.rsa
          REPODEST: /root/packages
        run: |
          docker run --rm -e ABUILD_PRIVKEY -e PACKAGER_PRIVKEY -e REPODEST -v "$PWD:/custom" -w /custom alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a sh -ec '
            apk add -U alpine-sdk
            printenv ABUILD_PRIVKEY > "$PACKAGER_PRIVKEY"
            openssl rsa -in "$PACKAGER_PRIVKEY" -pubout -out "$PACKAGER_PRIVKEY.pub"
            cp "$PACKAGER_PRIVKEY.pub" /etc/apk/keys/
            for dir in */; do abuild -F -r -C "$dir"; done
            mv "$REPODEST/${PWD##*/}" repo
            cp "$PACKAGER_PRIVKEY.pub" repo/
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64
          path: repo

  deploy:
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    needs: [build-x86_64, build-aarch64]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: repo
          merge-multiple: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
