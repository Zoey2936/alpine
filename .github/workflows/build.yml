name: build
on:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: packages
        run: echo "packages=$(jq -n -c '$ARGS.positional | map(rtrimstr("/"))' --args */)" >> $GITHUB_OUTPUT

  build-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: packages
    strategy:
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: package
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
          PACKAGER_PRIVKEY: /root/zoey2936.rsa
          REPODEST: /root/packages
        run: |
          sed -i "s|^pkgrel=.*|pkgrel=${{ github.run_number }}|" ${{ matrix.package }}/APKBUILD
          docker run --rm -e ABUILD_PRIVKEY -e PACKAGER_PRIVKEY -e REPODEST -v "$PWD:/custom" -w /custom alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf sh -ec '
            apk add -U alpine-sdk
            printenv ABUILD_PRIVKEY > "$PACKAGER_PRIVKEY"
            openssl rsa -in "$PACKAGER_PRIVKEY" -pubout -out "$PACKAGER_PRIVKEY.pub"
            cp "$PACKAGER_PRIVKEY.pub" /etc/apk/keys/
            abuild -F -r -C ${{ matrix.package }}
            mv "$REPODEST/${PWD##*/}" repo
            cp "$PACKAGER_PRIVKEY.pub" repo/
          '
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: x86_64-${{ matrix.package }}
          path: repo

  build-aarch64:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    needs: packages
    strategy:
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: package
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
          PACKAGER_PRIVKEY: /root/zoey2936.rsa
          REPODEST: /root/packages
        run: |
          sed -i "s|^pkgrel=.*|pkgrel=${{ github.run_number }}|" ${{ matrix.package }}/APKBUILD
          docker run --rm -e ABUILD_PRIVKEY -e PACKAGER_PRIVKEY -e REPODEST -v "$PWD:/custom" -w /custom alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf sh -ec '
            apk add -U alpine-sdk
            printenv ABUILD_PRIVKEY > "$PACKAGER_PRIVKEY"
            openssl rsa -in "$PACKAGER_PRIVKEY" -pubout -out "$PACKAGER_PRIVKEY.pub"
            cp "$PACKAGER_PRIVKEY.pub" /etc/apk/keys/
            abuild -F -r -C ${{ matrix.package }}
            mv "$REPODEST/${PWD##*/}" repo
            cp "$PACKAGER_PRIVKEY.pub" repo/
          '
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: aarch64-${{ matrix.package }}
          path: repo

  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: [build-x86_64, build-aarch64]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: repo
          merge-multiple: true
      - name: index
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
          PACKAGER_PRIVKEY: /root/zoey2936.rsa
        run: |
          docker run --rm -e ABUILD_PRIVKEY -e PACKAGER_PRIVKEY -v "$PWD/repo:/repo" -w /repo alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf sh -ec '
            apk add -U abuild
            printenv ABUILD_PRIVKEY > "$PACKAGER_PRIVKEY"
            cp *.pub /etc/apk/keys/
            for arch in */; do (cd "$arch" && apk index --no-warnings -o APKINDEX.tar.gz --rewrite-arch "${arch%/}" *.apk && abuild-sign APKINDEX.tar.gz && apk mkndx --sign-key "$PACKAGER_PRIVKEY" --pkgname-spec "${arch%/}/\${name}-\${version}.apk" -o Packages.adb *.apk); done
          '
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: repo
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
